<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Set the light/dark theme attribute before anything paints, so there's
         no flash of the wrong theme while React/CSS load. Keep the storage
         key ("mhf-theme-preference") in sync with src/context/ThemeContext.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mhf-theme-preference');
          var pref = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          // localStorage/matchMedia unavailable (e.g. private browsing edge
          // cases) — fall back to the CSS default (light).
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Assign and track employee tasks on a simple calendar." />
    <title>Mid Haven Furniture</title>

    <!-- Installable "app" behavior: adding this to the home screen (Safari's
         Share > Add to Home Screen, or Chrome's install prompt) launches it
         full-screen with no browser address bar/toolbar, on every page —
         not just the ones short enough to hide Safari's chrome on their own. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mid Haven Furniture" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- iOS doesn't generate a launch splash screen from manifest.webmanifest
         the way Android does — without these, opening the app from the Home
         Screen shows a blank white flash before anything paints. Apple has
         no single "any size" splash image either; it matches the *exact*
         device-width/device-height/pixel-ratio of the tag against the
         device, so this needs one explicit entry per screen size (device-
         width/height always reflect the device's portrait dimensions, even
         for the landscape entries — only `orientation` changes for those).
         Each size has a light and a dark variant, picked via
         prefers-color-scheme in the media query (this is a well-established
         community technique, not something Apple documents officially, but
         it does work on real devices). It reflects the PHONE'S OS-level
         Settings > Display appearance at the moment the app launches — the
         splash renders before any of our JS runs, so it can't see the
         in-app light/dark/system theme picker; it can only match "system".
         Regenerate via /tmp's gen_splash.py (light, background color from
         manifest.webmanifest) and gen_splash_dark.py (dark, background color
         matching --color-bg under :root[data-theme='dark'] in index.css) if
         the app icon or either background color ever changes. -->
    <link rel="apple-touch-startup-image" href="/splash/iphone-8-portrait.png" media="(prefers-color-scheme: light) and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-8-portrait-dark.png" media="(prefers-color-scheme: dark) and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
